name: MULTI SMART

permissions:
  contents: write

on:
  schedule:
    - cron: '*/5 11-23,0-3 * * *'   # 6am - 11pm Lima
  workflow_dispatch:

concurrency:
  group: multi-smart
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Check syntax
        run: |
          python -m py_compile multi_smart.py
          echo "✅ Sintaxis OK"

      - name: Run MULTI SMART
        env:
          COINBEACON_TOKEN: ${{ secrets.COINBEACON_TOKEN_SMART }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python multi_smart.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/multi_smart.csv ]; then git add data/multi_smart.csv; fi
          if [ -f data/multi_smart_state.json ]; then git add data/multi_smart_state.json; fi
          if [ -f data/multi_smart_historial_lineas.csv ]; then git add data/multi_smart_historial_lineas.csv; fi
          if [ -f data/multi_smart_tps.csv ]; then git add data/multi_smart_tps.csv; fi
          if [ -f data/multi_smart_throttle.json ]; then git add data/multi_smart_throttle.json; fi

          if git diff --staged --quiet; then
            echo "📭 Sin cambios."
          else
            git commit -m "Multi Smart [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && break
              sleep 5
            done
            for i in 1 2 3; do
              git push && echo "✅ Push OK" && break
              git pull --rebase origin main || true
              sleep 10
            done
          fi
