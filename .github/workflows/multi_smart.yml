name: MULTI SMART

permissions:
  contents: write

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: multi-smart-interspot
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Check syntax
        run: |
          python -m py_compile multi_smart.py
          echo "✅ Sintaxis OK"

      - name: Run MULTI SMART
        env:
          COINBEACON_TOKEN: ${{ secrets.COINBEACON_TOKEN_SMART }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================"
          echo "🚀 INICIO MULTI SMART"
          date -u
          echo "========================================"

          python -u multi_smart.py

          echo "========================================"
          echo "🏁 FIN MULTI SMART"
          date -u
          echo "========================================"

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/multi_smart.csv \
            data/multi_smart_state.json \
            data/multi_smart_historial_lineas.csv \
            data/multi_smart_tps.csv \
            data/multi_smart_throttle.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "📭 Sin cambios."
            exit 0
          fi

          git commit -m "Multi Smart [skip ci]"

          for i in 1 2 3; do
            git pull --rebase origin main && \
            git push origin HEAD:main && \
            echo "✅ Push OK" && \
            exit 0

            echo "⚠️ Intento $i falló, reintentando..."
            sleep 10
          done

          echo "❌ No se pudo hacer push"
          exit 1
