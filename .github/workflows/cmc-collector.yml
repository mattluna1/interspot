name: CMC Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run CMC collector
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python cmc_collector.py

      - name: Show collected data
        run: |
          echo "========================================"
          echo "CMC DATA"
          echo "========================================"

          if [ -f data/cmc/market_history.csv ]; then
            echo "Archivo encontrado:"
            ls -lh data/cmc/market_history.csv

            echo ""
            echo "Últimas 10 filas:"
            tail -n 10 data/cmc/market_history.csv
          else
            echo "ERROR: No se encontró market_history.csv"
            exit 1
          fi
