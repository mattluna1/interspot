name: ANALISIS PRE PUMP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analisis-pre-pump
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'                          # ← caché activado

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt       # ← usa el requirements

      - name: Run Analisis
        run: python -u analisis_pre_pump.py
