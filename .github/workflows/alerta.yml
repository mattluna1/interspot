name: ALERTA ARRANQUE

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: alerta-arranque-interspot
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests

      - name: Run Alerta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SECRETOS_JSON: ${{ secrets.SECRETOS_JSON }}
        run: python -u alerta_arranque.py

      - name: Commit BTC state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f btc_state.json ]; then
            git add btc_state.json
            if ! git diff --cached --quiet; then
              git commit -m "update btc_state [skip ci]"
              git pull --rebase origin main || true
              git push || true
            fi
          fi
