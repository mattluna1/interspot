name: OLEADAS

on:
  workflow_dispatch:
    inputs:
      telegram:
        description: 'Enviar a Telegram (1=sí, 0=no)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: oleadas-cmc
  cancel-in-progress: false

jobs:
  oleadas:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests

      - name: Run Oleadas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLEADAS_TELEGRAM: ${{ github.event.inputs.telegram }}
        run: python -u oleadas.py
